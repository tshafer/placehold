# Test and deploy when a version tag is pushed (e.g. v1.7.0).
# Run tests on the tag ref, then trigger Ploi deploy.
# Secrets: set PLOI_DEPLOY_WEBHOOK in repo Settings → Secrets with the Ploi Quick Deploy URL.

name: Release (test + deploy)

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Trigger Ploi deploy
        run: |
          if [ -n "${{ secrets.PLOI_DEPLOY_WEBHOOK }}" ]; then
            curl -sS -X POST "${{ secrets.PLOI_DEPLOY_WEBHOOK }}"
            echo "Deploy triggered."
          else
            echo "PLOI_DEPLOY_WEBHOOK not set; skipping deploy trigger."
          fi
