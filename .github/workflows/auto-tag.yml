# On push to default branch, create and push the next patch tag (v1.2.3 -> v1.2.4).
# Release workflow is triggered via workflow_run when this job completes (no PAT needed).

name: Auto tag

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next version and push tag
        run: |
          # Latest tag by semver (v*), not by commit date
          TAG=$(git tag -l 'v*' | sort -V | tail -1)
          TAG=${TAG:-v0.0.0}
          TAG=${TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          PATCH=$((PATCH + 1))
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: $NEXT (Release workflow will run when this is pushed)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEXT"
          git push origin "$NEXT"
